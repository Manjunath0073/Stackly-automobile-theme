<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>404 |Stackly Auto</title>

    <!-- GOOGLE FONT -->

    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- REMIX ICON -->

    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="404.css">

</head>

<body>

    <!-- ===================================== -->
    <!-- PREMIUM 404 -->
    <!-- ===================================== -->

    <section class="error-page">

        <div class="error-container">

            <!-- LEFT SIDE -->

            <div class="error-content">

                <span class="error-tag">

                    <span></span>

                    Navigation Error

                </span>

                <h1 class="error-code">

                    4<span class="error-code-style">0</span>4

                </h1>

                <h2 class="error-heading">

                    This Page Is
                    <span>
                        Off The Track
                    </span>

                </h2>

                <p class="error-description">

                    The page you are trying to access
                    doesn't exist or may have been moved.
                    Continue exploring our premium automotive experience.

                </p>

                <!-- ACTION BUTTONS -->

                <div class="error-actions">

                    <!-- GO BACK -->

                    <button
                        class="primary-btn"
                        onclick="history.back()"
                    >

                        Go Back

                    </button>

                    <!-- HOME -->

                    <a
                        href="index.html"
                        class="secondary-btn"
                    >

                        Back To Home

                    </a>

                </div>

            </div>

            <!-- RIGHT SIDE -->

            <div class="error-card">

                <div class="error-icon">

                    <i class="ri-roadster-fill"></i>

                </div>

                <h3>Page Not Found</h3>

                <p>
                    Premium route recalibration
                    currently in progress.
                </p>

                <div class="error-line"></div>

            </div>

        </div>

    </section>

</body>

</html>
